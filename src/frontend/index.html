<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Motion Viz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/human.icon" href="/human.ico">
    <script type="module" src="/src/main.ts"></script>
    <!-- <link rel="stylesheet" href="src/frontend/src/custom.css" /> is included via FastAPI in file backend/src/main.py -->
  </head>
  <body>
    <div id="ui-overlay">
      
      <input type="file" id="upload_files" multiple/>
      <button id="client_uploads_btn">Upload Files</button>
      <div id="client_uploads_status"></div>

      <button id="convert_bvh_to_npy_btn">Convert BVH to NPY</button>
      <div id="convert_bvh_to_npy_status"></div>

      <button id="convert_csv_kinectv1_to_npy_btn">Convert CSV Kinect_V1 to NPY</button>
      <div id="convert_csv_kinectv1_to_npy_status"></div>

      <button id="convert_csv_c3d_to_npy_btn">Convert CSV_C3D to NPY</button>
      <div id="convert_csv_c3d_to_npy_status"></div>

      <button id="convert_csv_sgementbased_to_npy_btn">Convert CSV segment based to NPY</button>
      <div id="convert_csv_sgementbased_to_npy_status"></div>

      <button id="convert_pv_style_btn">Convert File as done in Pose Viewer</button>
      <div id="convert_pv_style_status"></div>


      <div id="file_selector">
        <select id="file_dropdown">
          <option value="">Choose a motion file</option>
        </select>
        <div id="file_selector_status"></div>
      </div>


    </div>

    <!-- Three JS <canvas> is inserted here -->
    <div id="scene-container">
    </div>


    <div id="timeline-container">
      <div id="frame-label">Frame: 0 / 0</div>
      <input type="range" id="frame-slider" min="0" max="100" value="0" />
      <div id="preview-popup" style="
        display: none;
        position: absolute;
        top: -110px;
        width: 160px;
        height: 90px;
        background: black;
        border: 1px solid #ccc;
        pointer-events: none;
      ">
      <img id="preview-img" src="" style="width: 100%; height: 100%;" />
    </div>
  </body>
</html>
