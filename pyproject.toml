 [project]
name = "backend"
version = "0.1.0"
description = "Visualization of motion-capture data"
authors = [
    { name = "mathias gewissen", email = "mathias.gewissen@htw-dresden.de" },
]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "numpy>=1.26.0",
    "python-multipart (>=0.0.20)",
    "setuptools (>=80.9.0)",
    "scipy (>=1.15.3)",
    "pandas (>=3.0.5)",
    "upc-pymotion (>=0.2.3)",
    "pyquaternion (>=0.9.9)",
    "mvnx @ git+https://github.com/edscher/mvnx.git",
    "tqdm (>=4.67.1)",
    "tensorflow",
    "motionstack @ git+ssh://git@gitlab.hrz.tu-chemnitz.de/edscher--tu-dresden.de/motionstack.git",
    "scikit-learn (>=1.9.0)",
    "joblib",
]
[project.optional-dependencies]
dev = ["black>=24.3.0", "isort>=5.13.0", "pytest>=8.1.0"]w

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
